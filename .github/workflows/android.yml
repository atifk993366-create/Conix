name: Build CONIX APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Download speaker model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 -o app/src/main/assets/speaker_model.onnx "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx"
          ls -l app/src/main/assets
      - name: Build debug APK
        run: gradle assembleDebug -PverCode=$((1000 + ${{ github.run_number }}))
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CONIX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
